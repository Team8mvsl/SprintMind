name: Jira Ticket Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-jira-snapshot:
    name: Fetch SCRUM project snapshot
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}

    steps:
      - name: Check out SprintMind
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Ticket Agent
        run: npm test

      - name: Fetch Jira project snapshot
        run: npm start
