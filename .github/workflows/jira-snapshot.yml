name: SprintMind Jira and Assignment Agents

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-project-plan:
    name: Read SCRUM and recommend assignments
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      SPRINTMIND_TEAM: ${{ vars.SPRINTMIND_TEAM }}

    steps:
      - name: Check out SprintMind
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify agents
        run: npm test

      - name: Read Jira and recommend assignments
        run: node src/index.js
